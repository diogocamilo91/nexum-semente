<style>
.chat{display:grid;grid-template-columns:270px 1fr;
      height:calc(100dvh - var(--barra) - env(safe-area-inset-top));
      background:var(--fundo)}
.chatlista{background:var(--painel);border-right:1px solid var(--linha);
           display:flex;flex-direction:column;min-height:0}
.chatlista .topo{display:flex;align-items:center;gap:6px;padding:10px 10px 6px}
.chatlista .topo b{flex:1;font-size:13px;color:var(--fraco);text-transform:uppercase;
                   letter-spacing:.06em}
.chatabas{display:flex;gap:4px;padding:0 8px 8px}
.chatabas button{flex:1;padding:6px;border:0;background:none;border-radius:9px;
                 font:inherit;font-size:12.5px;color:var(--fraco);cursor:pointer}
.chatabas button.on{background:var(--painel2);color:var(--texto);font-weight:600}
#conversas{flex:1;overflow-y:auto;padding:0 8px 14px}
.conv{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;
      cursor:pointer;font-size:14.5px;color:var(--texto)}
.conv:hover{background:var(--painel2)}
.conv.on{background:var(--marca-fraca);font-weight:600}
.conv span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .pt{width:7px;height:7px;border-radius:50%;background:var(--marca);flex:0 0 auto;
          animation:chatpisca 1.2s infinite}
@keyframes chatpisca{50%{opacity:.25}}
.conv .mais{opacity:0;border:0;background:none;color:var(--fraco);cursor:pointer;
            font-size:16px;padding:0 3px;line-height:1}
.conv:hover .mais,.conv.on .mais{opacity:1}

.chatconv{display:flex;flex-direction:column;min-width:0;min-height:0}
.chattopo{display:flex;align-items:center;gap:6px;padding:9px 12px;
          border-bottom:1px solid var(--linha);background:var(--painel)}
.chattopo #titulo{flex:1;font-weight:600;font-size:15px;overflow:hidden;
                  text-overflow:ellipsis;white-space:nowrap}
.chattopo button{border:0;background:none;color:var(--texto);cursor:pointer;
                 font-size:17px;padding:4px 8px;border-radius:9px}
.chattopo button:hover{background:var(--painel2)}
#voltalista{display:none}
#msgs{flex:1;overflow-y:auto;padding:16px 14px 6px;display:flex;flex-direction:column;gap:12px}
#msgs .vazio{max-width:340px;align-self:center}
.msg{max-width:min(720px,86%);padding:10px 14px;border-radius:16px;white-space:pre-wrap;
     overflow-wrap:anywhere;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--marca);color:#fff;border-bottom-right-radius:5px}
.msg.assistant{align-self:flex-start;background:var(--painel);border:1px solid var(--linha);
               border-bottom-left-radius:5px}
.msg.sistema{align-self:center;background:none;color:var(--fraco);font-size:13.5px;
             text-align:center;padding:2px}
.msg img{max-width:100%;border-radius:10px;display:block;margin:3px 0}
.msg audio{width:min(290px,68vw);margin:3px 0}
.msg a.arq{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.msg.user a.arq{color:#fff;text-decoration:underline}
.msg code{background:#0000001a;padding:1px 5px;border-radius:5px;font-size:13.5px;
          font-family:ui-monospace,Menlo,Consolas,monospace}
.msg pre{background:#0000001a;padding:10px 12px;border-radius:10px;overflow-x:auto;margin:8px 0}
.msg pre code{background:none;padding:0}
.msg .pensei{margin-top:8px;font-size:13.5px;opacity:.8}
.msg .pensei summary{cursor:pointer}
#status{align-self:flex-start;display:none;gap:9px;align-items:center;color:var(--fraco);
        font-size:14px;padding:2px 4px}
#status .bolas{display:flex;gap:4px}
#status .bolas i{width:6px;height:6px;border-radius:50%;background:var(--fraco);
                 animation:chatpisca 1.1s infinite}
#status .bolas i:nth-child(2){animation-delay:.15s}
#status .bolas i:nth-child(3){animation-delay:.3s}
#parar{border:1px solid var(--linha);border-radius:8px;padding:2px 9px;font-size:13px;
       background:none;color:var(--texto);cursor:pointer;font-family:inherit}

#baixo{border-top:1px solid var(--linha);background:var(--painel);
       padding:9px 11px calc(9px + env(safe-area-inset-bottom))}
#anexado{display:none;align-items:center;gap:8px;font-size:13.5px;color:var(--fraco);
         padding:0 4px 8px}
#anexado img{height:36px;border-radius:6px}
#anexado button{border:0;background:none;color:var(--fraco);cursor:pointer;font-size:15px}
#caixa{display:flex;gap:7px;align-items:flex-end}
#texto{flex:1;resize:none;max-height:170px;min-height:44px;padding:11px 14px;border-radius:14px;
       border:1px solid var(--linha);background:var(--painel2);color:var(--texto);font:inherit;
       outline:none}
#texto:focus{border-color:var(--marca);background:var(--painel)}
.cbtn{width:44px;height:44px;flex:0 0 auto;border-radius:14px;background:var(--painel2);
      border:1px solid var(--linha);color:var(--texto);cursor:pointer;font-size:17px}
.cbtn:active{transform:scale(.95)}
#enviar{background:var(--marca);border-color:var(--marca);color:#fff}
#gravar.on{background:var(--erro);border-color:var(--erro);color:#fff}
#menuconv{position:fixed;background:var(--painel);border:1px solid var(--linha);
          border-radius:12px;padding:6px;display:none;z-index:35;min-width:170px;
          box-shadow:var(--sombra)}
#menuconv button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;
                 background:none;border-radius:8px;font:inherit;font-size:14px;
                 color:var(--texto);cursor:pointer}
#menuconv button:hover{background:var(--painel2)}

@media (max-width:760px){
  .chat{grid-template-columns:1fr}
  .chatlista{position:absolute;inset:var(--barra) 0 0 0;z-index:5}
  body.conversa-aberta .chatlista{display:none}
  body:not(.conversa-aberta) .chatconv{display:none}
  #voltalista{display:block}
  .msg{max-width:90%}
}
</style>

<div class=chat>
  <aside class=chatlista>
    <div class=topo><b>Conversas</b>
      <button class=cbtn id=nova title='Nova conversa'
              style='width:34px;height:34px;font-size:16px'>✚</button></div>
    <div class=chatabas>
      <button data-quais=ativas class=on>Abertas</button>
      <button data-quais=arquivadas>Arquivadas</button>
      <button data-quais=lixeira>Excluídas</button>
    </div>
    <div id=conversas></div>
  </aside>

  <section class=chatconv>
    <div class=chattopo>
      <button id=voltalista title='Voltar'>‹</button>
      <div id=titulo>—</div>
      <button id=opcoes title='Opções'>⋯</button>
    </div>
    <div id=msgs></div>
    <div id=baixo>
      <div id=anexado></div>
      <div id=caixa>
        <button class=cbtn id=clipe title='Anexar'>📎</button>
        <textarea id=texto rows=1
                  placeholder='Escreva, cole um print ou grave um áudio…'></textarea>
        <button class=cbtn id=gravar title='Gravar áudio'>🎤</button>
        <button class=cbtn id=enviar title='Enviar'>➤</button>
      </div>
      <input type=file id=arquivo hidden>
    </div>
  </section>
</div>
<div id=menuconv></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const API = "/api/chat";
let atual=null, es=null, buf="", n=0, quais="ativas", anexo=null;
let gravador=null, pedacos=[], t0=null, relogio=null;

const aviso = t => (window.nxAviso ? nxAviso(t) : null);
const escapa = s => (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function formata(s){
  let h = escapa(s);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (m,l,c) => `<pre><code>${c}</code></pre>`);
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,
        '$1<a class=arq href="$2" target="_blank" rel="noopener">$2</a>');
  return h;
}
const api = (url, body) => fetch(url, {method:"POST",
   headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{})})
   .then(r => r.json());

/* ---------------- lista ---------------- */
async function carregaLista(){
  const r = await fetch(`${API}/conversas?quais=${quais}`);
  if (r.status === 401) return location.reload();
  const d = await r.json();
  const box = $("#conversas"); box.innerHTML = "";
  if (!d.conversas.length){
    box.innerHTML = quais === "ativas"
      ? "<div class=vazio style='padding:26px 10px'><span class=ico>💬</span>" +
        "<b>Nenhuma conversa ainda</b>" +
        "<button class='btn primario' id=comecar style='margin-top:12px'>Começar uma conversa</button>" +
        "</div>"
      : "<div class=vazio style='padding:22px 10px;font-size:14px'>nada aqui</div>";
    const cb = document.getElementById("comecar");
    if (cb) cb.onclick = novaConversa;
  }
  for (const c of d.conversas){
    const el = document.createElement("div");
    el.className = "conv" + (c.id === atual ? " on" : "");
    el.innerHTML = (d.respondendo.includes(c.id) ? "<i class=pt></i>" : "")
                 + "<span></span><button class=mais>⋯</button>";
    el.querySelector("span").textContent = c.titulo;
    el.onclick = () => abre(c.id);
    el.querySelector(".mais").onclick = e => { e.stopPropagation(); menu(e, c); };
    box.appendChild(el);
  }
}

function menu(e, c){
  e.stopPropagation();
  const m = $("#menuconv"); m.innerHTML = "";
  const item = (txt, fn) => { const b = document.createElement("button");
    b.textContent = txt; b.onclick = () => { m.style.display="none"; fn(); }; m.appendChild(b); };
  item("Renomear", async () => {
    const t = prompt("Novo nome:", c.titulo); if (!t) return;
    await api(`${API}/conversas/${c.id}/titulo`, {titulo:t});
    if (c.id === atual) $("#titulo").textContent = t;
    carregaLista();
  });
  if (quais === "lixeira"){
    item("Restaurar", async () => { await api(`${API}/conversas/${c.id}/excluir`, {voltar:true});
      aviso("de volta"); carregaLista(); });
  } else {
    item(c.arquivado ? "Desarquivar" : "Arquivar", async () => {
      await api(`${API}/conversas/${c.id}/arquivar`, {arquivado: !c.arquivado});
      aviso(c.arquivado ? "de volta na lista" : "arquivada"); carregaLista(); });
    item("Excluir", async () => {
      await api(`${API}/conversas/${c.id}/excluir`, {});
      aviso("foi pras excluídas — nada some de verdade"); carregaLista(); });
  }
  m.style.display = "block";
  const r = e.target.getBoundingClientRect();
  m.style.left = Math.min(r.left, innerWidth - 190) + "px";
  m.style.top = (r.bottom + 6) + "px";
}
document.addEventListener("click", e => {
  if (!e.target.closest("#menuconv") && !e.target.classList.contains("mais"))
    $("#menuconv").style.display = "none";
});

/* ---------------- abrir ---------------- */
async function abre(id){
  atual = id; buf = ""; n = 0;
  document.body.classList.add("conversa-aberta");
  const d = await (await fetch(`${API}/conversas/${id}`)).json();
  $("#titulo").textContent = d.conversa.titulo;
  pinta(d.mensagens);
  carregaLista();
  ligaStream(id);
  try { localStorage.setItem("nx-ultima-conversa", id); } catch(e){}
}

function pinta(msgs){
  const box = $("#msgs"); box.innerHTML = "";
  for (const m of msgs) box.appendChild(bolha(m));
  const st = document.createElement("div"); st.id = "status";
  st.innerHTML = "<span class=bolas><i></i><i></i><i></i></span>" +
                 "<span id=stxt>pensando</span><span id=stempo></span>" +
                 "<button id=parar>parar</button>";
  box.appendChild(st);
  $("#parar").onclick = () => api(`${API}/conversas/${atual}/parar`);
  desce();
}

function bolha(m){
  const el = document.createElement("div");
  el.className = "msg " + m.papel;
  let html = "";
  if (m.arquivo){
    const url = `${API}/anexo/${m.arquivo}`, t = m.arquivo_tipo || "";
    if (t.startsWith("image/")) html += `<img src="${url}" alt="">`;
    else if (t.startsWith("audio/")) html += `<audio controls src="${url}"></audio>`;
    else html += `<a class=arq href="${url}">📎 ${escapa(m.arquivo_nome||"arquivo")}</a>`;
  }
  if (m.texto) html += `<div>${formata(m.texto)}</div>`;
  if (m.pensei) html += `<details class=pensei><summary>o que ele pensou</summary>${formata(m.pensei)}</details>`;
  el.innerHTML = html || "&nbsp;";
  return el;
}
const desce = () => { const b = $("#msgs"); b.scrollTop = b.scrollHeight; };

/* ---------------- streaming ---------------- */
function ligaStream(id){
  if (es) es.close();
  es = new EventSource(`${API}/conversas/${id}/stream`);
  es.addEventListener("status",  e => { const d = JSON.parse(e.data); mostraStatus(d.texto, d.desde); });
  es.addEventListener("parcial", e => { const d = JSON.parse(e.data);
    buf = d.texto; n = d.n; digitando(); });              /* SETA: idempotente */
  es.addEventListener("delta",   e => { const d = JSON.parse(e.data);
    if (d.n <= n) return;                                 /* dedup do que já veio */
    buf += d.texto; n = d.n; digitando(); });
  es.addEventListener("titulo",  e => { $("#titulo").textContent = JSON.parse(e.data).titulo;
    carregaLista(); });
  es.addEventListener("nova", () => recarrega());
  es.addEventListener("fim", () => { buf=""; n=0; escondeStatus(); recarrega(); });
}

async function recarrega(){
  if (!atual) return;
  const d = await (await fetch(`${API}/conversas/${atual}`)).json();
  const box = $("#msgs");
  const perto = box.scrollHeight - box.scrollTop - box.clientHeight < 220;
  pinta(d.mensagens);
  if (perto) desce();
  carregaLista();
}

function mostraStatus(texto, desde){
  const st = $("#status"); if (!st) return;
  st.style.display = "flex";
  $("#stxt").textContent = texto;
  t0 = Date.now() - (desde || 0);
  clearInterval(relogio);
  relogio = setInterval(() => {
    const s = Math.floor((Date.now() - t0)/1000);
    $("#stempo").textContent = s < 60 ? `· ${s}s`
      : `· ${Math.floor(s/60)} min${s%60 ? " " + (s%60) + "s" : ""}`;
  }, 1000);
}
function escondeStatus(){
  const st = $("#status"); if (st) st.style.display = "none";
  clearInterval(relogio);
  const p = document.getElementById("prev"); if (p) p.remove();
}
function digitando(){
  let p = document.getElementById("prev");
  if (!p){ p = document.createElement("div"); p.id = "prev"; p.className = "msg assistant";
           $("#msgs").insertBefore(p, $("#status")); }
  p.innerHTML = formata(buf);
  desce();
}

/* ---------------- mandar ---------------- */
async function envia(){
  const texto = $("#texto").value.trim();
  if (!texto && !anexo) return;
  if (!atual) await novaConversa();
  const fd = new FormData();
  fd.append("texto", texto);
  if (anexo) fd.append("arquivo", anexo, anexo.name || "anexo");
  $("#texto").value = ""; $("#texto").style.height = "auto";
  limpaAnexo();
  const r = await fetch(`${API}/conversas/${atual}/mensagem`, {method:"POST", body:fd});
  if (!r.ok){ aviso("não consegui mandar"); return; }
  recarrega();
}

async function novaConversa(){
  const d = await api(`${API}/conversas`, {});
  atual = d.id; quais = "ativas";
  document.querySelectorAll(".chatabas button").forEach(b =>
    b.classList.toggle("on", b.dataset.quais === "ativas"));
  await abre(d.id);
}

/* ---------------- anexo, print e áudio ---------------- */
function poeAnexo(f){
  anexo = f;
  const a = $("#anexado"); a.style.display = "flex"; a.innerHTML = "";
  if (f.type.startsWith("image/")){
    const img = document.createElement("img"); img.src = URL.createObjectURL(f); a.appendChild(img);
  }
  const s = document.createElement("span"); s.textContent = f.name || "anexo"; a.appendChild(s);
  const x = document.createElement("button"); x.textContent = "✕"; x.onclick = limpaAnexo;
  a.appendChild(x);
}
function limpaAnexo(){ anexo = null; $("#anexado").style.display="none"; $("#anexado").innerHTML=""; }

$("#clipe").onclick = () => $("#arquivo").click();
$("#arquivo").onchange = e => { if (e.target.files[0]) poeAnexo(e.target.files[0]); };
document.addEventListener("paste", e => {
  for (const f of e.clipboardData.files){ poeAnexo(f); aviso("print colado"); e.preventDefault(); }
});
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault(); if (e.dataTransfer.files[0]) poeAnexo(e.dataTransfer.files[0]);
});

$("#gravar").onclick = async () => {
  if (gravador && gravador.state === "recording"){ gravador.stop(); return; }
  try{
    const st = await navigator.mediaDevices.getUserMedia({audio:true});
    gravador = new MediaRecorder(st); pedacos = [];
    gravador.ondataavailable = e => pedacos.push(e.data);
    gravador.onstop = () => {
      st.getTracks().forEach(t => t.stop());
      $("#gravar").classList.remove("on");
      poeAnexo(new File([new Blob(pedacos, {type:"audio/webm"})], "audio.webm",
                        {type:"audio/webm"}));
      aviso("áudio pronto — toque em enviar");
    };
    gravador.start(); $("#gravar").classList.add("on");
    aviso("gravando… toque de novo pra parar");
  } catch(err){ aviso("não consegui usar o microfone"); }
};

/* ---------------- amarras ---------------- */
$("#enviar").onclick = envia;
$("#nova").onclick = novaConversa;
$("#voltalista").onclick = () => document.body.classList.remove("conversa-aberta");
$("#opcoes").onclick = e => { if (atual) menu(e,
  {id:atual, titulo:$("#titulo").textContent, arquivado: quais === "arquivadas"}); };
$("#texto").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 170) + "px";
});
$("#texto").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && innerWidth > 760){ e.preventDefault(); envia(); }
});
document.querySelectorAll(".chatabas button").forEach(b => b.onclick = () => {
  quais = b.dataset.quais;
  document.querySelectorAll(".chatabas button").forEach(x => x.classList.toggle("on", x === b));
  carregaLista();
});

function boasVindas(){
  $("#titulo").textContent = "—";
  $("#msgs").innerHTML =
    "<div class=vazio style='margin:auto'><span class=ico>💬</span>" +
    "<b>Me manda a primeira mensagem</b>" +
    "Escreva embaixo, grave um áudio no microfone, cole um print (Ctrl+V) " +
    "ou anexe um arquivo no clipe.</div>";
}

carregaLista().then(() => {
  let u = null;
  try { u = localStorage.getItem("nx-ultima-conversa"); } catch(e){}
  const primeira = document.querySelector(".conv");
  if (innerWidth > 760){
    if (u && document.querySelector(".conv")) abre(+u);
    else if (primeira) primeira.click();
    else boasVindas();
  } else if (!primeira) boasVindas();
});
})();
</script>
